<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaptionBoost - AI Subtitles</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      margin: 0;
      padding: 0;
      font-family: "JetBrains Mono", "JetBrains Mono Fallback", monospace;
      background: #ffffff;
      color: #333;
    }

    .popup-container {
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #0066cc;
    }

    .user-profile {
      font-size: 12px;
      color: #666;
    }

    .status {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
    }

    .status.active {
      color: #00a44f;
      font-weight: 600;
    }

    .quota-card {
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #ffffff;
      border: 1px solid #dbe7f5;
    }

    .quota-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 8px;
      color: #374151;
      font-weight: 600;
    }

    .quota-bar {
      width: 100%;
      height: 8px;
      background: #e9eef6;
      border-radius: 999px;
      overflow: hidden;
    }

    .quota-fill {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: #0066cc;
      transition: width 0.25s ease;
    }

    .quick-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .quick-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      color: #1f3d63;
      border: 1px solid #d5dce6;
      border-radius: 8px;
      padding: 8px;
      background: #f8fbff;
    }

    .card {
      background: #fff;
      border: 1px solid #e0e8f0;
      border-radius: 12px;
      padding: 14px;
    }

    .auth-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      font-size: 12px;
      color: #666;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      border: 1px solid #d5dce6;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      box-sizing: border-box;
    }

    .form-input:focus {
      outline: none;
      border-color: #0066cc;
      box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.12);
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #0066cc;
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0, 102, 204, 0.25);
    }

    .btn-secondary {
      background: lab(36.9089% 35.0961 -85.6872);
      color: #fff;
      border: 1px solid lab(36.9089% 35.0961 -85.6872);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .divider {
      font-size: 12px;
      color: #999;
      text-align: center;
      margin: 12px 0;
    }

    .hint {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
      line-height: 1.4;
    }

    .settings {
      margin: 12px 0;
      padding: 12px;
      background: #fff;
      border: 1px solid #e0e8f0;
      border-radius: 10px;
    }

    .setting-group {
      margin-bottom: 12px;
    }

    .setting-group:last-child {
      margin-bottom: 0;
    }

    .setting-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .language-select, .model-select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d5dce6;
      border-radius: 8px;
      font-size: 13px;
      background: #fff;
    }

    .slider-group label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .slider {
      width: 100%;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-enable {
      background: #0066cc;
      color: #fff;
    }

    .btn-enable.active {
      background: #00b35c;
    }

    .btn-disable {
      background: #f5f7fb;
      color: #4b5563;
      border: 1px solid #d5dce6;
    }

    .logout-btn {
      margin-top: 10px;
      width: 100%;
      border: 1px solid #d5dce6;
      border-radius: 8px;
      background: #f5f7fb;
      color: #4b5563;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 16px;
      font-size: 13px;
      color: #666;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #e5e7eb;
      border-top: 3px solid #0066cc;
      border-radius: 50%;
      margin: 0 auto 8px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error,
    .success {
      display: none;
      border-radius: 8px;
      font-size: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }

    .error {
      background: #ffe8e8;
      border: 1px solid #ffb8b8;
      color: #b00020;
    }

    .success {
      background: #e8ffef;
      border: 1px solid #b6f0c7;
      color: #08763a;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="logo">CaptionBoost</div>
      <div class="user-profile" id="user-profile" style="display: none;">
        <span id="user-email"></span>
      </div>
    </div>

    <div id="error-message" class="error"></div>
    <div id="success-message" class="success"></div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Caricamento in corso...</p>
    </div>

    <div id="auth-screen" style="display: none;">
      <div class="card">
        <div id="step-email">
          <div class="auth-title">Accedi con codice email</div>
          <p class="auth-subtitle">
            Inserisci la tua email: ti inviamo un codice temporaneo.
          </p>

          <div class="form-group">
            <label class="form-label" for="auth-email">Email</label>
            <input id="auth-email" type="email" class="form-input" placeholder="tuo@email.com">
          </div>

          <button class="btn btn-primary" id="send-code-btn">Invia codice</button>
        </div>

        <div id="step-code" style="display: none;">
          <div class="auth-title">Verifica codice</div>
          <p class="auth-subtitle" id="code-hint-email"></p>

          <div class="form-group">
            <label class="form-label" for="auth-code">Codice a 6 cifre</label>
            <input id="auth-code" type="text" class="form-input" inputmode="numeric" maxlength="6" placeholder="123456">
          </div>

          <button class="btn btn-primary" id="verify-code-btn">Verifica e accedi</button>

          <div class="btn-row">
            <button class="btn btn-secondary" id="back-to-email-btn">Cambia email</button>
            <button class="btn btn-secondary" id="resend-code-btn">Reinvia codice</button>
          </div>

          <p class="hint">Il codice scade in pochi minuti.</p>
        </div>
      </div>
    </div>

    <div id="content" style="display: none;">
      <div class="status" id="status">Inattivo</div>

      <div class="quota-card">
        <div class="quota-header">
          <span>Piano Free</span>
          <span id="quota-label">0 / 10 video</span>
        </div>
        <div class="quota-bar">
          <div class="quota-fill" id="quota-fill"></div>
        </div>
      </div>

      <div class="quick-links" style="grid-template-columns: 1fr 1fr;">
        <a href="#" class="quick-link" id="plans-link">Piani</a>
        <a href="#" class="quick-link" id="subtitles-link">I miei sottotitoli</a>
        <a href="#" class="quick-link" id="qa-link">AI Q&A</a>
        <a href="#" class="quick-link" id="support-link">Supporto prioritario</a>
        <a href="#" class="quick-link" id="settings-link">Settings</a>
      </div>

      <div class="settings">
        <div class="setting-group">
          <label class="setting-label">Lingua sottotitoli originali</label>
          <select class="language-select" id="language">
            <option value="en">Inglese</option>
            <option value="it">Italiano</option>
            <option value="es">Spagnolo</option>
            <option value="fr">Francese</option>
            <option value="de">Tedesco</option>
            <option value="ja">Giapponese</option>
            <option value="zh">Cinese</option>
            <option value="pt">Portoghese</option>
            <option value="ru">Russo</option>
            <option value="ar">Arabo</option>
            <option value="ko">Coreano</option>
            <option value="hi">Hindi</option>
            <option value="th">Thai</option>
            <option value="vi">Vietnamita</option>
            <option value="id">Indonesiano</option>
            <option value="nl">Olandese</option>
            <option value="pl">Polacco</option>
            <option value="tr">Turco</option>
            <option value="sv">Svedese</option>
            <option value="da">Danese</option>
          </select>
        </div>

        <div class="setting-group">
          <label class="setting-label">Traduci in (opzionale)</label>
          <select class="language-select" id="translate-to">
            <option value="">Nessuna traduzione</option>
            <option value="it">Italiano</option>
            <option value="en">Inglese</option>
            <option value="es">Spagnolo</option>
            <option value="fr">Francese</option>
            <option value="de">Tedesco</option>
            <option value="pt">Portoghese</option>
            <option value="ru">Russo</option>
            <option value="ja">Giapponese</option>
            <option value="zh">Cinese</option>
            <option value="ko">Coreano</option>
            <option value="ar">Arabo</option>
            <option value="hi">Hindi</option>
            <option value="th">Thai</option>
            <option value="vi">Vietnamita</option>
            <option value="id">Indonesiano</option>
            <option value="nl">Olandese</option>
            <option value="pl">Polacco</option>
            <option value="tr">Turco</option>
            <option value="sv">Svedese</option>
            <option value="da">Danese</option>
          </select>
        </div>

        <div class="setting-group">
          <label class="setting-label">Modello AI</label>
          <select class="model-select" id="model">
            <option value="llama3">Llama3 (Veloce)</option>
            <option value="llama3-70b">Llama3 70B (Accurato)</option>
          </select>
        </div>

        <div class="setting-group slider-group">
          <label>
            <span>Dimensione font</span>
            <span id="fontSizeValue">14px</span>
          </label>
          <input type="range" id="fontSize" class="slider" min="10" max="24" value="14">
        </div>

        <div class="setting-group slider-group">
          <label>
            <span>Opacita'</span>
            <span id="opacityValue">100%</span>
          </label>
          <input type="range" id="opacity" class="slider" min="20" max="100" value="100" step="10">
        </div>
      </div>

      <div class="buttons">
        <button class="btn btn-enable" id="enable-btn">Abilita sottotitoli</button>
        <button class="btn btn-disable" id="disable-btn">Disabilita</button>
      </div>

      <button class="logout-btn" id="logout-btn">Esci</button>
    </div>
  </div>

  <script src="auth-module.js"></script>
  <script src="popup.js"></script>
</body>
</html>
